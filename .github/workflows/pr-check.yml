name: PR check

# Verification only: no secrets, no push, no deploy.
on:
  pull_request:
    branches: [ main, staging ]
    # labeled/unlabeled: adding `visual-change-approved` or `e2e-perf` starts a new run.
    types: [opened, synchronize, reopened, labeled, unlabeled]

# A new push or label change cancels the run on the outdated commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    # Prod-bundle check. Only runs for PRs against main, as before.
    if: github.base_ref == 'main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm ci

      - name: Build prod bundle
        run: npm run build

      - name: Verify prod bundle has no test-mode marker
        run: bash scripts/check-prod-bundle.sh

      - name: Build test bundle (VITE_TEST_MODE=1)
        run: npm run build -- --outDir dist-test --emptyOutDir
        env:
          VITE_TEST_MODE: '1'

      - name: Check test bundle (marker expected, warn-only until t_50a711f3 is merged)
        run: bash scripts/check-prod-bundle.sh --test dist-test

      - name: Docker test image build (not pushed)
        run: docker build --build-arg VITE_TEST_MODE=1 -t yellowhorrorhose:test .

  # Shard guard: fails if any e2e test (or a new tests/e2e/*.spec.js) is not run by
  # any shard below. Needs no browser (uses `playwright test --list`).
  e2e-shard-guard:
    name: e2e shard guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Check that every e2e test belongs to a shard
        run: node scripts/check-e2e-shards.mjs

  # e2e suite (npm run test:e2e) in the pinned Playwright image, split into
  # parallel shards so each stays well under the 10 minute budget (the frozen-clock
  # determinism tests render hundreds of software-GL frames and take ~8 min alone).
  # Every shard runs the same `npm run test:e2e` command with a file/-g filter; the
  # `e2e` job at the bottom is the single aggregate result to look at / require.
  # See docs/adr/0001-ci-e2e-baselines.md for the baseline strategy.
  #
  # The image tag MUST equal the exact @playwright/test version in package.json
  # (browser builds are tied to it). To bump: change @playwright/test in
  # package.json (+ lockfile), then set the tag below to the same version.
  # The "Check image matches package.json" step fails the job if they drift.
  e2e-shard:
    name: e2e (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.64.1
      options: --ipc=host
    strategy:
      fail-fast: false
      matrix:
        include:
          # baselines: true -> baselines are recorded from the base branch first
          # retries: determinism-* shards have 0 (a test that needs a retry is
          # non-determinism and must be red). visual/prod keep 1 against the
          # screenshot-timeout flake on shared runners; --fail-on-flaky-tests is
          # deliberately not used there.
          - name: visual
            baselines: true
            retries: 1
            args: --project=test visual.spec.js lighting.spec.js lighting-baseline.spec.js smoke.spec.js
          - name: prod
            baselines: false
            retries: 1
            args: --project=prod
          - name: determinism-hash
            baselines: false
            retries: 0
            args: --project=test determinism.spec.js -g "frozen canvas hash|key rotation"
          - name: determinism-astrid
            baselines: false
            retries: 0
            args: --project=test determinism.spec.js --timeout=240000 -g "Astrid in the house"
          - name: determinism-timers
            baselines: false
            retries: 0
            args: --project=test determinism.spec.js -g "classroom intro|snore bubbles"
          # The 10 s frozen-clock tests need more than the 90 s default on a CI runner.
          - name: determinism-candy
            baselines: false
            retries: 0
            args: --project=test determinism.spec.js --timeout=240000 -g "candy spawns"
          - name: determinism-remount
            baselines: false
            retries: 0
            args: --project=test determinism.spec.js --timeout=240000 -g "Canvas remount"
    env:
      PLAYWRIGHT_IMAGE_VERSION: 1.64.1
      # perf.spec.js is opt-in (shared software-GL runners are too noisy for a
      # mandatory p95 gate): add the PR label "e2e-perf" to include it in the visual shard.
      PERF_OPT_IN: ${{ contains(github.event.pull_request.labels.*.name, 'e2e-perf') }}
      # Intentional visual change (label "visual-change-approved"): the visual shard
      # records its baselines from the PR head instead of the base branch, so the
      # screenshot diff is not a gate, while all other e2e checks still run.
      VISUAL_APPROVED: ${{ contains(github.event.pull_request.labels.*.name, 'visual-change-approved') }}

    steps:
      # actions/checkout checks out the PR merge commit (refs/pull/N/merge).
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          path: head
          persist-credentials: false

      - name: Check image matches package.json
        working-directory: head
        run: |
          installed=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")
          echo "lockfile @playwright/test=$installed image=$PLAYWRIGHT_IMAGE_VERSION"
          test "$installed" = "$PLAYWRIGHT_IMAGE_VERSION"

      - name: Install dependencies
        working-directory: head
        run: npm ci

      # Baselines (screenshots, perf) are per environment and not committed. Record
      # them from the base branch here, in the same container, then compare the PR
      # head against them. GitHub sets CI=true by default, so it is unset (env -u CI)
      # here: a missing baseline is then written instead of failing.
      # With visual-change-approved the base is still needed for the perf baseline
      # (perf must stay a gate against the base); only screenshots come from the head.
      - name: Checkout base branch (${{ github.base_ref }})
        if: matrix.baselines && (env.VISUAL_APPROVED != 'true' || env.PERF_OPT_IN == 'true')
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          persist-credentials: false

      - name: Record baselines from base branch
        if: matrix.baselines && (env.VISUAL_APPROVED != 'true' || env.PERF_OPT_IN == 'true')
        working-directory: base
        run: |
          npm ci
          if [ "$VISUAL_APPROVED" = "true" ]; then
            # Perf baseline only; screenshot baselines are recorded from the head below.
            env -u CI npm run test:e2e -- --retries=1 --project=test perf.spec.js
            test -f tests/e2e/perf-baseline.json
            cp tests/e2e/perf-baseline.json ../head/tests/e2e/
            exit 0
          fi
          if [ "$PERF_OPT_IN" = "true" ]; then
            env -u CI npm run test:e2e -- --retries=1 --project=test visual.spec.js lighting-baseline.spec.js perf.spec.js
            test -f tests/e2e/perf-baseline.json
          else
            env -u CI npm run test:e2e -- --retries=1 --project=test visual.spec.js lighting-baseline.spec.js
          fi
          test -d tests/e2e/__baselines__
          cp -r tests/e2e/__baselines__ ../head/tests/e2e/__baselines__
          if [ -f tests/e2e/perf-baseline.json ]; then cp tests/e2e/perf-baseline.json ../head/tests/e2e/; fi

      # visual-change-approved: SCREENSHOT baselines come from the PR merge commit
      # itself (no base). The perf baseline is never recorded here, see above.
      - name: Record screenshot baselines from PR merge commit (visual-change-approved)
        if: matrix.baselines && env.VISUAL_APPROVED == 'true'
        working-directory: head
        run: |
          echo "::notice::Label visual-change-approved: screenshot baselines are recorded from the PR merge commit, the visual diff is not a gate. The label must be set by a human or the reviewer, never the PR author, and re-assessed after new commits."
          if [ "${{ github.event.action }}" = "synchronize" ]; then
            echo "::warning::visual-change-approved was set before this push: the approval does not cover the new commits until they have been re-assessed."
          fi
          env -u CI npm run test:e2e -- --retries=1 --project=test visual.spec.js lighting-baseline.spec.js

      # CI=true: a missing baseline fails (fail-closed) instead of passing vacuously.
      - name: Run e2e (${{ matrix.name }}) against PR head
        working-directory: head
        env:
          CI: 'true'
        run: |
          extra=""
          if [ "${{ matrix.name }}" = "visual" ] && [ "$PERF_OPT_IN" = "true" ]; then extra="perf.spec.js"; fi
          npm run test:e2e -- --retries=${{ matrix.retries }} ${{ matrix.args }} $extra

      - name: Upload e2e report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report-${{ matrix.name }}
          path: |
            head/playwright-report/
            head/test-results/
          retention-days: 7

  # Aggregate result of all shards.
  e2e:
    needs: [e2e-shard, e2e-shard-guard]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: All e2e shards and the shard guard passed
        run: |
          test "${{ needs.e2e-shard.result }}" = "success"
          test "${{ needs.e2e-shard-guard.result }}" = "success"
